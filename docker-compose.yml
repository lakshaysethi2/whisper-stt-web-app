services:
  whisper-web:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    ports:
      - "${HOST_PORT:-8561}:8000"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-en}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-536870912}
      - MIN_FREE_DISK_BYTES=${MIN_FREE_DISK_BYTES:-2147483648}
      - JOB_RETENTION_SECONDS=${JOB_RETENTION_SECONDS:-7200}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/cache
    volumes:
      - hf-cache:/cache
    tmpfs:
      - /tmp/whisper-stt:size=2G,uid=1000,gid=1000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  hf-cache:
